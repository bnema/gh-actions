name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        type: string
        default: 'stable'
      lint-timeout:
        description: 'golangci-lint timeout'
        type: string
        default: '5m'
      lint-version:
        description: 'golangci-lint version'
        type: string
        default: 'latest'
      lint-command:
        description: 'Optional project lint command. When set, this runs instead of golangci-lint-action.'
        type: string
        default: ''
      test-flags:
        description: 'Flags passed to go test'
        type: string
        default: '-race -v ./...'
      test-command:
        description: 'Optional project test command. When set, this runs instead of go test.'
        type: string
        default: ''
      pre-command:
        description: 'Command to run before lint/test (e.g. make build-frontend)'
        type: string
        default: ''
      container:
        description: 'Optional container image to run in'
        type: string
        default: ''
      apt-packages:
        description: 'Space-separated apt packages to install'
        type: string
        default: ''
      pacman-packages:
        description: 'Space-separated pacman packages to install'
        type: string
        default: ''
      paths-filter:
        description: 'Skip lint/test when only non-Go files change (requires dorny/paths-filter)'
        type: boolean
        default: false
      paths-filter-patterns:
        description: 'dorny/paths-filter patterns (YAML string)'
        type: string
        default: |
          go:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - '.golangci.yml'
            - 'Makefile'
            - '.github/workflows/**'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      go: ${{ inputs.paths-filter && steps.filter.outputs.go || 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: inputs.paths-filter
      - uses: dorny/paths-filter@v4
        id: filter
        if: inputs.paths-filter
        with:
          filters: ${{ inputs.paths-filter-patterns }}

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    container: ${{ inputs.container || null }}
    steps:
      - name: Install apt packages
        if: inputs.apt-packages != ''
        run: |
          apt-get update && apt-get install -y ${{ inputs.apt-packages }}

      - name: Install pacman packages
        if: inputs.pacman-packages != ''
        run: |
          pacman -Syu --noconfirm ${{ inputs.pacman-packages }}

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Run pre-command
        if: inputs.pre-command != ''
        run: ${{ inputs.pre-command }}

      - name: Run golangci-lint
        if: inputs.lint-command == ''
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.lint-version }}
          args: --timeout=${{ inputs.lint-timeout }}

      - name: Run lint command
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    container: ${{ inputs.container || null }}
    steps:
      - name: Install apt packages
        if: inputs.apt-packages != ''
        run: |
          apt-get update && apt-get install -y ${{ inputs.apt-packages }}

      - name: Install pacman packages
        if: inputs.pacman-packages != ''
        run: |
          pacman -Syu --noconfirm ${{ inputs.pacman-packages }}

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Run pre-command
        if: inputs.pre-command != ''
        run: ${{ inputs.pre-command }}

      - name: Run tests
        if: inputs.test-command == ''
        run: go test ${{ inputs.test-flags }}

      - name: Run test command
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
