name: Go Release

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use when go-version-file is empty'
        type: string
        default: 'stable'
      go-version-file:
        description: 'Go version file to use'
        type: string
        default: ''
      goreleaser-version:
        description: 'GoReleaser version'
        type: string
        default: '~> v2'
      goreleaser-args:
        description: 'GoReleaser arguments'
        type: string
        default: 'release --clean'
      node-version:
        description: 'Node.js version (leave empty to skip)'
        type: string
        default: ''
      apt-packages:
        description: 'Space-separated apt packages to install'
        type: string
        default: ''
      pre-command:
        description: 'Command to run before goreleaser'
        type: string
        default: ''
    secrets:
      AUR_KEY:
        description: 'Optional SSH private key for GoReleaser AUR publishing'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Install apt packages
        if: inputs.apt-packages != ''
        run: |
          sudo apt-get update && sudo apt-get install -y ${{ inputs.apt-packages }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Setup Go from version file
        if: inputs.go-version-file != ''
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Setup Go
        if: inputs.go-version-file == ''
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: ${{ inputs.go-version }}

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run pre-command
        if: inputs.pre-command != ''
        run: ${{ inputs.pre-command }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
