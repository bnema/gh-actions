name: Gordon Deploy

on:
  workflow_call:
    inputs:
      image:
        description: 'Image name (defaults to repository name)'
        type: string
        default: ''
      tag:
        description: 'Override image tag (defaults to git tag or short SHA)'
        type: string
        default: ''
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        default: './Dockerfile'
      context:
        description: 'Build context path'
        type: string
        default: '.'
      build-args:
        description: 'Build arguments (KEY=value, one per line)'
        type: string
        default: ''
      platforms:
        description: 'Target platforms (e.g. linux/amd64,linux/arm64)'
        type: string
        default: ''
      push-latest:
        description: 'Also push with :latest tag'
        type: boolean
        default: true
    secrets:
      GORDON_REGISTRY:
        required: true
      GORDON_USERNAME:
        required: true
      GORDON_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Gordon
        uses: bnema/gh-actions/actions/docker-deploy@main
        with:
          registry: ${{ secrets.GORDON_REGISTRY }}
          username: ${{ secrets.GORDON_USERNAME }}
          password: ${{ secrets.GORDON_TOKEN }}
          image: ${{ inputs.image }}
          tag: ${{ inputs.tag }}
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push-latest: ${{ inputs.push-latest }}
